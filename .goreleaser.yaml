version: 2

builds:
  - binary: maestro
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: maestro_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE.md
      - README.md
      - skills/maestro/SKILL.md

checksum:
  name_template: checksums.txt

# The release body comes from CHANGELOG.md through --release-notes (see
# .github/workflows/release.yml); a disabled changelog would drop that file too.
release:
  name_template: "{{ .Version }}"

homebrew_casks:
  - name: maestro
    repository:
      owner: jalendport
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jalendport/maestro
    description: Routes, dispatches, checks, and reviews agent work across Claude Code, Codex, Grok, and Antigravity
    binaries:
      - maestro
    # Homebrew deprecated the postflight stanza for postflight_steps. GoReleaser
    # renders postflight_steps from hooks.post.install_steps only from 2.19, so
    # until that release the stanza goes in through custom_block.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/maestro"]
        end
      end
