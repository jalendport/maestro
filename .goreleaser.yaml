version: 2

builds:
  - binary: maestro
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: maestro_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE.md
      - README.md
      - skills/maestro/SKILL.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: maestro
    repository:
      owner: jalendport
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jalendport/maestro
    description: Routes, dispatches, checks, and reviews agent work across Claude Code, Codex, Grok, and Antigravity
    binaries:
      - maestro
